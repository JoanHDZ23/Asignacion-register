<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradientes vectoriales en tonos morados -->
    <linearGradient id="purpleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <linearGradient id="purpleGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="swillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="40%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="60%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#2E1065" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Anillo exterior -->
    <circle cx="240" cy="250" r="150" fill="none" stroke="url(#purpleGrad1)" stroke-width="32" filter="url(#shadow)" />
    
    <!-- Marcador superior -->
    <path d="M 240 70 L 240 92" stroke="#4C1D95" stroke-width="8" stroke-linecap="round" />

    <!-- Anillo interior concéntrico -->
    <circle cx="240" cy="250" r="95" fill="none" stroke="url(#purpleGrad2)" stroke-width="20" stroke-dasharray="420 80" transform="rotate(-40 240 250)" filter="url(#shadow)"/>

    <!-- Curva inferior/dinámica -->
    <path d="M 100 300 C 90 380 170 420 240 400 C 180 410 120 370 125 310 Z" fill="url(#swillGrad)" filter="url(#shadow)" />
    <path d="M 115 320 C 110 240 200 160 300 180 C 200 170 130 230 135 310 Z" fill="url(#swillGrad)" opacity="0.9" />

    <!-- Manecilla con flecha -->
    <g filter="url(#shadow)">
      <line x1="240" y1="250" x2="360" y2="130" stroke="url(#arrowGrad)" stroke-width="28" stroke-linecap="round" />
      <path d="M 330 110 L 400 90 L 380 160 Z" fill="url(#arrowGrad)" stroke-linejoin="round" />
    </g>

    <!-- Núcleo central -->
    <circle cx="240" cy="250" r="30" fill="url(#centerGlow)" filter="url(#shadow)" />
    <circle cx="240" cy="250" r="12" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
